name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: python -m pip install -r requirements.txt
      - run: python -m vpg validate
      - run: python -m vpg docs --check
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m vpg dry-run
