- id: n22_targeted_regeneration
  num: 22
  name: Targeted regeneration
  phase: Learn
  subgraph: iteration
  kind: tool
  purpose: Route each blocking defect to the node that produced it, invalidate only those nodes and their dependents, and snapshot hashes for the before/after comparison.
  inputs: ['defects:open', 'state:runtime.rework_cycles']
  context: [Re-run only the affected node and its invalidated dependents; approved upstream outputs are never regenerated]
  state_read: [evaluation.defects, runtime.nodes]
  state_write: [runtime.rework_cycles]
  agent: production-orchestrator
  skills: [goal-harness, debugging-and-error-recovery]
  tools: ['vpg.tools.regen:plan']
  instructions: Deterministic. The loop edges from this node re-activate each target with its defects as rework context.
  outputs:
  - {key: regeneration_plan, kind: json, description: 'Targets, closure, preserved nodes, corrections, baseline hashes'}
  completion:
  - {type: artifact, key: regeneration_plan, description: Plan exists}
  rubric: [regeneration]
  failure_conditions: [No routable target for a blocking defect]
  retry: {max_attempts: 2, behavior: Tool errors only}
  escalation: {after: A loop edge exceeds its traversal bound, to: Wei, report: 'The defect, its target and the cycles spent'}
  human_review: {required: false, decision: Not required}
  provenance: [regeneration_plan ledger event with targets and preserved nodes]
  run: {tool: 'regen:plan'}
  gate: regeneration_plan
- id: n23_final_verification
  num: 23
  name: Final verification
  phase: Learn
  subgraph: delivery
  kind: tool
  purpose: Recompute the release conditions from disk (gate, defects, reviewed master hash, deliverables, ledger), prepare the release summary, and ask Wei for the release decision.
  inputs: ['reviews:current', 'defects:open', 'artifact:master', 'control:production']
  context: [Machine QA is not human release approval (R01 quality contract; every R07 report)]
  state_read: [evaluation.gate_results, evaluation.defects, history.approvals]
  state_write: [history.decisions]
  agent: final-approval
  skills: [shipping-and-launch, traffic-light-decisions]
  tools: ['vpg.tools.verify:final']
  instructions: Deterministic verification. Then the engine waits for Wei's decision (approved | changes_requested). Changes loop back to feedback interpretation.
  outputs:
  - {key: verification, kind: json, description: Recomputed release checks}
  - {key: release_summary, kind: markdown, description: What Wei is asked to release}
  - {key: decision_digest, kind: markdown, description: Numbered human-facing end-review digest}
  - {key: review_packet, kind: markdown, description: Blind-then-reveal end-review packet}
  - {key: decision_template, kind: json, description: Decision template for the single end-review answer}
  - {key: review_html, kind: html, description: Self-contained review form, required: false}
  completion:
  - {type: tool, fn: 'verify:check_final', description: Every release condition recomputes true}
  rubric: [release]
  failure_conditions: [No passing gate for the current version, The master changed after review, A deliverable missing]
  retry: {max_attempts: 2, behavior: Re-verify after the cause is fixed}
  escalation: {after: 2 failed verifications, to: Wei, report: The release condition that fails}
  human_review:
    required: true
    decision: Release the version, or request changes with feedback
    approver: Wei
    outcomes: [approved, changes_requested]
  provenance: [Release decision recorded with actor; dry-run approvals labelled not human]
  controls:
    read: [production, evaluation]
    write: []
  run: {tool: 'verify:final'}
  outcomes: [approved, changes_requested]
- id: n24_packaging_delivery
  num: 24
