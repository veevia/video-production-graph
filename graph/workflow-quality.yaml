- id: n26_look_development
  num: 26
  name: Look development
  phase: Design
  subgraph: planning
  kind: agent
  purpose: 'Prove the visual spec before anything is built: render 3 to 5 style frames (one per DESIGN.md role) and a short motion test from the spec alone, and measure them against the approved look gates and the benchmark films.'
  inputs: ['artifact:design_system', 'artifact:creative_decision', 'control:design', 'control:spec-design', 'control:spec-tokens', 'control:spec-motion', 'control:spec-gates']
  context: ['A look problem found in the master (a saturated ground, product UI unreadable in an embedded player) costs a full rebuild; found at the look gate it costs a re-render', 'Measure the frames, not the intent: the gate compares each role with the same role in the benchmarks']
  state_read: [production.design_system_ref, production.creative_decision_ref]
  state_write: [production.refs]
  agent: visual-design
  skills: [design-system-author, design-system-as-infrastructure, frontend-design, impeccable, video-shotcraft]
  tools: [deterministic HTML/SVG renderer (Playwright/Chromium) or PIL, ffmpeg, vpg spec hash]
  instructions: Complete spec/DESIGN.md, DESIGN.tokens.json and MOTION.md from design.md. Render one style frame per DESIGN.md style_frames role at 1920 px wide or larger and a motion test of MOTION.md's length, then write look-frames.json (the spec hash from `vpg spec hash spec/`, each frame's role, file and sha256, the motion test file). A failing gate is fixed in the spec, then re-rendered.
  prompt: prompts/n26_look_development.md
  outputs:
  - {key: look_frames, kind: json, schema: look-frames, description: Style frames and motion test manifest, state_path: production.refs.look_frames}
  - {key: look_report, kind: json, description: Look gate report (written by the check), required: false}
  completion:
  - {type: artifact, key: look_frames, schema: look-frames, description: Manifest validates}
  - {type: tool, fn: 'look:check', description: Rendered from the current spec; every look gate passes for every role against the pinned benchmarks; the motion test is the right length and does not flash}
  - {type: tool, fn: 'design:check_palette', description: Every approved text pair meets WCAG contrast; approved assets match their hashes}
  rubric: [look]
  failure_conditions: [A style frame outside its role's benchmark envelope, Frames rendered from an older spec, 'A look gate that cannot be judged (registry missing, unpinned or without the role)', A motion test that flashes more than 3 times in a second]
  retry: {max_attempts: 3, behavior: 'Re-dispatch with the failing gates, roles, values and envelopes; fix the spec, then re-render'}
  escalation: {after: 3 consecutive failures or 2 rejections, to: Wei, report: 'The gates the look cannot meet, the values tried, and the spec changes that did not move them'}
  human_review:
    required: true
    decision: Approve the look (style frames and motion test) before any asset is built
    approver: Wei
    outcomes: [approved, rejected]
  provenance: ['look-frames.json and look-report.json per attempt (spec hash, measurements, gates)', 'design.md, DESIGN.md, its tokens and MOTION.md locked on approval']
  controls:
    read: [creative, design, spec-design, spec-tokens, spec-motion, spec-gates]
    write: [design, spec-design, spec-tokens, spec-motion]
    lock_on_approval: [design, spec-design, spec-tokens, spec-motion]
  resources: [renderer]
  run: {command_hook: true}
  outcomes: [approved, rejected]
- id: n27_animatic
  num: 27
  name: Animatic
  phase: Design
  subgraph: planning
  kind: agent
  purpose: 'Prove the timing before the full build: the storyboard''s boards timed to a scratch read and a music sketch, checked for runtime, beat shares, pace, pauses, must-say terms and music hit points.'
  inputs: ['artifact:storyboard', 'artifact:script', 'control:creative', 'control:spec-story', 'control:spec-voice', 'control:spec-music', 'control:spec-mix', 'control:spec-gates']
  context: [Timing found in the master costs a full rebuild; timing found in an animatic costs a re-read, 'Cut words, never pauses, to fit the cap']
  state_read: [production.storyboard_ref, production.script_ref]
  state_write: [production.refs]
  agent: storyboard
  skills: [storyboard, video-prototype, video-shotcraft]
  tools: [local TTS (scratch read), ffmpeg, vpg spec hash]
  instructions: Time each storyboard beat to a scratch read of the current script (start and end per beat), add the music sketch when MUSIC.md asks for one and the times its hit points land, and write animatic.json with the spec hash from `vpg spec hash spec/`. Render the timed boards as a video for Wei's review.
  prompt: prompts/n27_animatic.md
  outputs:
  - {key: animatic, kind: json, schema: animatic, description: 'Timed beats, scratch read and music sketch', state_path: production.refs.animatic}
  - {key: animatic_report, kind: json, description: Animatic check report (written by the check), required: false}
  completion:
  - {type: artifact, key: animatic, schema: animatic, description: Manifest validates}
  - {type: tool, fn: 'animatic:check', description: 'Made from the current spec; runtime, beat shares, pace, pauses, voice over music, terms and hit points inside the approved spec'}
  rubric: [animatic]
  failure_conditions: [Runtime over the STORY.md cap, A beat far from its share, Pace or pauses outside their gate, A must-say term never spoken, A music hit point missed]
  retry: {max_attempts: 3, behavior: 'Re-dispatch with the failing beats, gates, terms and hit points'}
  escalation: {after: 3 consecutive failures or 2 rejections, to: Wei, report: The timing the script and boards cannot meet together}
  human_review:
    required: true
    decision: Approve the animatic before voice, assets and scenes are built
    approver: Wei
    outcomes: [approved, rejected]
  provenance: ['animatic.json and animatic-report.json per attempt (spec hash, measurements, beat shares, hit points)']
  controls:
    read: [creative, spec-story, spec-voice, spec-music, spec-mix, spec-gates]
    write: []
  resources: [tts, renderer]
  run: {command_hook: true}
  outcomes: [approved, rejected]
