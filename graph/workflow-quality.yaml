  tools: ['WCAG contrast calculator (vpg.tools._common:contrast)']
  instructions: 'Complete design.md, whose front-matter holds the palette, text_pairs, fonts, approved_assets (with sha256) and prohibited patterns, and production.md, whose front-matter holds resolution, fps, codecs, loudness, deliverables and narration_wps. Write design-system.json as the token export. Quality workflow: also complete spec/VOICE.md, MUSIC.md and MIX.md (pace band, pauses, the music''s role and hit points, the voice-over-music floor). design.md stays open: N26 develops the look from it and locks it with the visual spec.'
