# GENERATED by `python -m vpg docs` from graph/workflow.yaml and the overlay in vpg/quality.py: edit those, not this
# file (`vpg docs --check` fails when it drifts). Opt in per project with `workflow: quality`.
id: video-production-quality
name: Graph-based video production workflow with look and animatic gates
version: 1.0.0
description: 'The default workflow plus the spec family as control documents, a look gate (N26) and an animatic gate (N27) before any asset is built, and the spec''s build gates and ratchet at technical QA. Generated from graph/workflow.yaml by `python -m vpg docs` (vpg/quality.py); opt in with `workflow: quality`.'
start: START
end: END
policies:
  max_rework_cycles: 6
  max_same_defect_failures: 3
  parallel_limit: 6
  single_flight_resources: [tts, renderer, capture, image-api]
  blocking_severities: [P1, P2, P3]
  dry_run_actor: dry-run-auto
subgraphs:
- id: discovery
  name: Discovery and grounding
  pattern: sequence + bounded loop (gaps → intake)
  purpose: Gather sources, validate them, freeze the immutable inputs.
  nodes: [n01_context_intake, n02_source_validation]
- id: definition
  name: Definition
  pattern: sequence with human gates
  purpose: Lock objective, audience, product truth and creative direction before anything is produced.
  nodes: [n03_objective_audience, n04_product_understanding, n05_narrative_ideation, n06_creative_direction]
- id: planning
  name: Planning
  pattern: fan-out (script ∥ visual system) → look gate → fan-in (storyboard) → animatic gate
  purpose: Turn the direction into a script, a visual system, an approved look, a storyboard, an approved animatic and an asset plan.
  nodes: [n07_script_development, n09_visual_system, n26_look_development, n08_storyboard_shots, n27_animatic, n10_asset_planning]
- id: production
  name: Production
  pattern: fan-out (assets map ∥ voice) → fan-in (motion) → assembly
  purpose: Produce assets, narration, scenes and the assembled master.
  nodes: [n11_asset_generation, n12_voice_audio, n13_motion_scenes, n14_video_assembly]
- id: review
  name: Review
  pattern: fan-out six reviewers → fan-in
  purpose: Evaluate the rendered master in parallel against explicit gates.
  nodes: [n15_technical_qa, n16_creative_critique, n17_design_compliance, n18_accessibility_legibility, n19_product_accuracy, n20_narrative_pacing]
- id: iteration
  name: Iteration
  pattern: tri-state gate → bounded targeted rework loop
  purpose: Interpret critique and feedback, gate the version, regenerate only what the defects trace to.
  nodes: [n21_feedback_interpretation, n22_targeted_regeneration]
- id: delivery
  name: Delivery and learning
  pattern: human release gate → package → governed learning
  purpose: Verify, get the human release decision, package, and learn.
  nodes: [n23_final_verification, n24_packaging_delivery, n25_learning_memory]
nodes:
- id: n01_context_intake
  num: 1
  name: Context discovery and intake
  phase: Understand
  subgraph: discovery
  kind: agent
  purpose: Find and register every source that can ground the film — brief, product evidence (prototype, demo recording, spec), brand authority, prior versions and feedback — with an evidence tag, without inventing any.
  inputs: ['state:inputs.brief', 'files:sources/**', 'artifact:gaps', 'control:product', 'control:memory', 'defects:open']
  context: [The production brief and the requester's messages, Project-hub raw intake (00_context_intake) and wiki, 'Earlier rounds, their reviews and the requester''s feedback', 'Meeting recordings are cited by id, never quoted']
  state_read: [inputs.brief, inputs.constraints, production.open_questions]
  state_write: [inputs.sources, production.open_questions]
  agent: context-research
  skills: [context-intake, context-pull, workiq-grounding, evidence-tagging, wiki-query]
  tools: [markitdown MCP, WorkIQ MCP (read-only), local file search]
  instructions: Register each source with id, path, kind (brief|product|prototype|recording|spec|brand|design|feedback|prior-version|transcript|url) and evidence (observed|reported|assumed). List open questions, and mark a question blocking only when the film cannot proceed without the answer. The film needs product evidence (a spec, prototype or recording) and brand authority registered. Register regular files only, each once, with its one kind (a directory, pipe or device is refused). N02 judges coverage by content. Only files stored in the project's own sources/ directory count (a symlinked sources/ counts nothing), and not copies of control documents or templates; a file registered under two kinds (the brief included) counts as neither, and an assumed source never counts; on a loop back from N02, resolve every gap in `artifact:gaps` by registering the missing source. A gap you cannot resolve stays open; never mark a question or a note as resolving it. When the intake loop runs out, N02 escalates to Wei, who supplies the source or waives the gap by name. Never summarise a source in place of registering it, and never quote confidential meeting content.
  prompt: prompts/n01_context_intake.md
  outputs:
  - key: sources
    kind: json
    schema: sources
    description: Source registry
    state_fields: {sources: inputs.sources, open_questions: production.open_questions}
  - {key: intake_notes, kind: markdown, description: What each source contributes and what is missing, required: false}
  completion:
  - {type: artifact, key: sources, schema: sources, description: Source registry validates against the sources schema}
  - {type: tool, fn: 'sources:check_registry', description: 'Every source exists locally or is a cited remote reference, with a valid evidence tag'}
  rubric: [intake]
  failure_conditions: [No product evidence registered, A source registered without an evidence tag, A local source path does not exist]
  retry: {max_attempts: 3, behavior: Re-dispatch with the failing registry checks and the gaps from N02 as context}
  escalation: {after: '3 consecutive failed attempts, or N02 loops back twice', to: Wei, report: 'Sources found, sources missing, and the questions only Wei can answer'}
  human_review: {required: false, decision: Not required; N03 is the first human gate}
  provenance: [Source ids and sha256 recorded at N02, Evidence tag per source, 'Ledger: node_dispatched / node_passed']
  controls:
    read: [product, memory]
    write: []
- id: n02_source_validation
  num: 2
  name: Source validation and context-gap detection
  phase: Understand
  subgraph: discovery
  kind: tool
  purpose: Hash every local source, detect context gaps (missing brief, product evidence, brand authority, control documents, blocking questions), and freeze the immutable inputs once they are sufficient.
  inputs: ['state:inputs.sources', 'state:inputs.brief', 'state:production.open_questions']
  context: ['Recovered lesson: lock evidence before rendering; re-render on drift', Product truth must never be invented to fill a gap]
  state_read: [inputs.sources, inputs.brief, production.open_questions]
  state_write: [inputs.sources]
  agent: context-research
  skills: [evidence-tagging]
  tools: ['vpg.tools.sources:validate']
  instructions: Deterministic. `pass` freezes the inputs (hash recorded). `gaps_resolvable` loops back to intake with the gap list. `gaps_blocking` escalates to Wei with the blocking questions.
  outputs:
  - {key: gaps, kind: json, description: Context gaps with severity blocking|resolvable|note}
  - key: sources_validated
    kind: json
    description: Sources with sha256 and size
    state_fields: {sources: inputs.sources}
  completion:
  - {type: artifact, key: gaps, description: Gap report exists}
  - {type: artifact, key: sources_validated, description: Hashed source list exists}
  rubric: [intake]
  failure_conditions: [A registered local source is missing (blocking gap), No brief (blocking), No product or brand evidence (resolvable gap)]
  retry: {max_attempts: 2, behavior: 'Tool errors only; gaps are outcomes, not failures'}
  escalation: {after: 'gaps_blocking, or the intake loop traversed twice', to: Wei, report: The gap list with what would resolve each gap}
  human_review: {required: false, decision: Not required; blocking gaps escalate to Wei}
  provenance: [inputs_frozen ledger event with the inputs hash, gaps.json kept per attempt]
  run: {tool: 'sources:validate'}
  outcomes: [pass, gaps_resolvable, gaps_blocking]
  gate: freeze_inputs
- id: n03_objective_audience
  num: 3
  name: Objective and audience definition
  phase: Understand
  subgraph: definition
  kind: agent
  purpose: State the film's objective as an observable target, name the audience and the review lenses, set the runtime cap and success criteria, and agree the quality bar (evaluation.md) with Wei.
  inputs: ['state:inputs.sources', 'state:inputs.brief', 'control:evaluation', 'knowledge:rules', 'control:spec-gates', 'control:spec-design']
  context: ['The runtime cap is a hard constraint: the case study went from 2:00 (R05) to 2:30 (R06) to ≤150 s (R07)', 'Review lenses in the case study: customer executive, domain-operations leader, sustainability leader, engineer, first-time viewer', 'Perspective: how the platform helps the customer''s experts solve business problems']
  state_read: [inputs.sources, inputs.brief]
  state_write: [production.brief_ref, production.objective, production.audience, production.business_context]
  agent: production-orchestrator
  skills: [problem-framing, extreme-clarity, success-metrics, goal-harness]
  tools: []
  instructions: 'Write brief.json (an objective with a number or observable end state, the audience, ≥3 checkable success criteria, runtime target and cap, constraints). A success criterion is checkable when it contains a number, ≤ or ≥, "must", "never", "always", "within" or "viewer can …"; every criterion must pass that test. Complete evaluation.md (gates, thresholds, human checkpoints). Never write an adjective objective ("make it better"). Quality workflow: also complete spec/GATES.yaml, the approved bar: each gate''s metric and version, its envelope (benchmark or stated), severity, stage and the rule ids it enforces, and the benchmark registry pinned by path and sha256. Wei approves it with the objective.'
  prompt: prompts/n03_objective_audience.md
  outputs:
  - key: brief
    kind: json
    schema: brief
    description: Objective, audience, success criteria, runtime
    state_path: production.brief_ref
    state_fields: {objective: production.objective, audience: production.audience, business_context: production.business_context}
  completion:
  - {type: artifact, key: brief, schema: brief, description: Brief validates against the brief schema}
  - {type: tool, fn: 'briefs:check_brief', description: 'Objective is observable, ≥3 checkable success criteria, runtime target ≤ cap'}
  - type: tool
    fn: briefs:doc_complete
    args:
      docs: [evaluation]
      front_matter:
        evaluation: [gates]
    description: evaluation.md is complete
  - {type: tool, fn: 'qualitygates:check_bar', description: 'GATES.yaml lints clean; the benchmark registry is pinned, unchanged and verifies; every benchmark gate has an envelope; the references show every look role'}
  rubric: [brief]
  failure_conditions: [Objective is an adjective, Fewer than 3 checkable success criteria, Runtime cap missing, 'Benchmark registry missing, unpinned, changed since it was pinned, or failing its own check']
  retry: {max_attempts: 3, behavior: 'Re-dispatch with the failing checks; if Wei rejects, loop to intake for missing context'}
  escalation: {after: '3 consecutive failures, or Wei rejects twice', to: Wei, report: 'Draft objective, open questions, and the tension blocking agreement'}
  human_review:
    required: true
    decision: Approve the objective, audience, runtime cap and quality bar
    approver: Wei
    outcomes: [approved, rejected]
  provenance: [Approval recorded with actor (human or labelled dry-run), evaluation.md locked on approval (hash + snapshot), GATES.yaml locked on approval with the registry pin (part of the bar)]
  controls:
    read: [product, creative, evaluation, spec-gates, spec-design]
    write: [evaluation, spec-gates]
    lock_on_approval: [evaluation, spec-gates]
  outcomes: [approved, rejected]
- id: n04_product_understanding
  num: 4
  name: Product and experience understanding
  phase: Understand
  subgraph: definition
  kind: agent
  purpose: Establish product truth from the evidence — capabilities, required interactions, demo scenarios, the engineers' terminology, prohibited terms and the only claims the film may make — and lock it.
  inputs: ['state:inputs.sources', 'artifact:brief', 'control:product']
  context: ['R07 P3: engineer terminology from the demo recording is the source of truth; requested terms with no source are mapped, not invented', 'No invented UI, counters, metrics or architecture edges (video-shotcraft guidance)', 'The deep product walkthrough opens the detail page, never stopping at a list (R07 P4)']
  state_read: [inputs.sources, production.objective, production.audience]
  state_write: [production.product_truth_ref, production.product_context, production.product_requirements]
  agent: product-understanding
  skills: [evidence-tagging, jobs-to-be-done, grounding-critic-designer, webapp-testing]
  tools: [Playwright (read-only prototype walk), transcript search]
  instructions: Complete product.md. Its front-matter terminology, prohibited list and verified_claims each carry a source; its body covers every required section. Write product-summary.json. Anything not in the sources goes to "Content that must not be invented".
  prompt: prompts/n04_product_understanding.md
  outputs:
  - key: product_summary
    kind: json
    schema: product-summary
    description: Capabilities, scenarios, requirements
    state_path: production.product_truth_ref
    state_fields: {product_context: production.product_context, product_requirements: production.product_requirements}
  completion:
  - {type: artifact, key: product_summary, schema: product-summary, description: Product summary validates}
  - type: tool
    fn: briefs:doc_complete
    args:
      docs: [product]
      front_matter:
        product: [terminology, prohibited, verified_claims]
    description: product.md is complete with a machine contract
  rubric: [product-truth]
  failure_conditions: [A claim without a source, Terminology differs from the engineers' words, Missing 'content that must not be invented']
  retry: {max_attempts: 3, behavior: Re-dispatch with the failing sections and unsourced items}
  escalation: {after: 3 consecutive failures or a rejected review, to: Wei, report: Unsourced claims and terms that need an owner}
  human_review:
    required: true
    decision: Approve product truth (terminology, claims, scenarios)
    approver: Wei
    outcomes: [approved, rejected]
  provenance: [product.md locked on approval, Every term and claim cites a source id]
  controls:
    read: [product, evaluation]
    write: [product]
    lock_on_approval: [product]
  outcomes: [approved, rejected]
- id: n05_narrative_ideation
  num: 5
  name: Narrative and concept ideation
  phase: Design
  subgraph: definition
  kind: agent
  purpose: Propose at least three distinct concept directions with different anchors, each with a structure, strengths and named risks.
  inputs: ['artifact:brief', 'artifact:product_summary', 'control:product', 'control:memory', 'feedback:open']
  context: ['Rubric-authoring: diverse anchors defeat overfitting (≥3 directions)', 'Proven arc: challenge → intelligence layer → how it works → architecture → product walkthrough → what''s next', 'Wei''s perspective: Microsoft technology helping the customer''s experts']
  state_read: [production.objective, production.audience, production.product_context]
  state_write: [production.concepts_ref]
  agent: creative-director
  skills: [video-prototype, concept-creator, video-shotcraft, design-principles]
  tools: []
  instructions: Write concepts.json with ≥3 concepts whose anchors differ (for example a problem-first story, a user's-day journey and a system reveal). Give each a logline, a chapter structure mapped to the objective, strengths and risks. For new concepts, add 1–5 scores on the concept fork dimensions (CON-FIT, DIR-BOUNDARIES, CRE-HOOK, CRE-ONE-MESSAGE, CRE-ARC, NAR-CLARITY, NAR-RELEVANCE, NAR-CONNECTION, NAR-PERSPECTIVE) plus score_rationale; old concepts without scores remain valid.
  prompt: prompts/n05_narrative_ideation.md
  outputs:
  - {key: concepts, kind: json, schema: concepts, description: Concept directions, state_path: production.concepts_ref}
  completion:
  - {type: artifact, key: concepts, schema: concepts, description: Concepts validate}
  - {type: tool, fn: 'briefs:check_concepts', description: '≥3 concepts with distinct anchors, structures and risks'}
  rubric: [concepts]
  failure_conditions: [Fewer than 3 directions, Directions that differ only in wording]
  retry: {max_attempts: 3, behavior: Re-dispatch with the rejection reasons from N06}
  escalation: {after: 3 consecutive failures or 2 rejected selections, to: Wei, report: Concepts tried and why each was rejected}
  human_review: {required: false, decision: Not required; selection happens at N06}
  provenance: [concepts.json per attempt]
  controls:
    read: [product, creative, memory]
    write: []
- id: n06_creative_direction
  num: 6
  name: Creative-direction selection
  phase: Design
  subgraph: definition
  kind: agent
  purpose: Compare the concepts against the objective and success criteria, recommend one, record why the others were rejected, and complete creative.md for Wei's decision.
  inputs: ['artifact:concepts', 'artifact:brief', 'control:creative', 'control:spec-story']
  context: ['Recovered: start from the strongest earlier direction instead of restarting; keep one brand-derived motion vocabulary']
  state_read: [production.concepts_ref, production.objective]
  state_write: [production.creative_decision_ref, production.narrative_ref, production.forks_ref]
  agent: creative-director
  skills: [traffic-light-decisions, design-criteria, video-shotcraft]
  tools: []
  instructions: 'Write creative-decision.json (selected id, rationale, a rejection reason for every other concept, narrative arc) and narrative.md. Complete creative.md (concept, structure, emotional progression, devices, tone, pacing, audience experience, boundaries). Quality workflow: complete spec/STORY.md for the selected direction: runtime target and cap, the beats with their share of the runtime, must-say terms and banned phrases.'
  prompt: prompts/n06_creative_direction.md
  outputs:
  - {key: creative_decision, kind: json, schema: creative-decision, description: Selected concept and rejections, state_path: production.creative_decision_ref}
  - {key: narrative, kind: markdown, description: Narrative arc, state_path: production.narrative_ref}
  - {key: fork, kind: json, schema: fork, description: Scored concept fork, state_path: production.forks_ref, per_item: true, required: false}
  completion:
  - {type: artifact, key: creative_decision, schema: creative-decision, description: Decision validates}
  - {type: tool, fn: 'briefs:check_decision', description: Selection is a known concept and every alternative has a rejection reason}
  - type: tool
    fn: briefs:doc_complete
    args:
      docs: [creative]
    description: creative.md is complete
  - type: tool
    fn: qualitygates:check_spec
    args:
      docs: [story]
    description: 'STORY.md lints clean: runtime, beats whose shares add up to 1, terms, rules'
  rubric: [creative-direction]
  failure_conditions: [Selected concept unknown, Alternatives rejected without a reason]
  retry: {max_attempts: 3, behavior: Re-dispatch with Wei's rejection feedback; a rejection loops back to ideation}
  escalation: {after: Wei rejects the direction twice, to: Wei, report: Directions tried and the unresolved creative tension}
  human_review:
    required: true
    decision: Select the creative direction
    approver: Wei
    outcomes: [approved, rejected]
  provenance: [Decision record with actor, creative.md locked on approval, STORY.md locked on approval]
  controls:
    read: [product, creative, evaluation, spec-story]
    write: [creative, spec-story]
    lock_on_approval: [creative, spec-story]
  outcomes: [approved, rejected]
- id: n07_script_development
  num: 7
  name: Script development
  phase: Design
  subgraph: planning
  kind: agent
  purpose: Write the narration as chapters and units, each unit tagged with the verified claims and product terms it relies on, within the runtime cap.
  inputs: ['artifact:brief', 'artifact:creative_decision', 'artifact:narrative', 'control:product', 'control:creative', 'control:production', 'defects:rework', 'control:spec-story', 'feedback:open']
  context: ['Engineer terms only; if a term is misheard by ASR in most voice takes, rephrase it (R07: ''versioned'' heard as ''version'' in 8/8 takes)', 'Cut words, never pauses, to fit the cap', 'Perspective: how Microsoft technology helps the customer''s experts solve business problems (R06)']
  state_read: [production.objective, production.creative_decision_ref, production.product_context]
  state_write: [production.script_ref]
  agent: narrative-script
  skills: [extreme-clarity, content-writing, demo-master, video-prototype]
  tools: []
  instructions: 'Write script.json (chapters → units with id, text, claims[], terms[]). Every claim id must be in product.md verified_claims; every product term must be in the terminology list; never use a prohibited term. Quality workflow: name each chapter after its STORY.md beat (or list it in the beat''s chapters), speak every must-say term and no banned phrase. A rejected animatic returns here with Wei''s feedback.'
  prompt: prompts/n07_script_development.md
  outputs:
  - {key: script, kind: json, schema: script, description: Chapters and narration units, state_path: production.script_ref}
  completion:
  - {type: artifact, key: script, schema: script, description: Script validates}
  - {type: tool, fn: 'accuracy:check_script', description: 'No prohibited terms, only verified claims, only known terms'}
  - {type: tool, fn: 'pacing:estimate_script', description: Estimated runtime fits the cap}
  - {type: tool, fn: 'specchecks:story_terms', description: Every STORY.md must-say term is spoken; no banned phrase is spoken or shown}
  rubric: [script]
  failure_conditions: [Prohibited term in narration, Unverified claim, Estimated runtime over the cap, 'A must-say term never spoken, or a banned phrase used']
  retry: {max_attempts: 3, behavior: Re-dispatch with the exact failing units and the replacement terms}
  escalation: {after: 3 consecutive failures or the same defect persisting 3 rework cycles, to: Wei, report: Units that cannot be both accurate and within the cap}
  human_review: {required: false, decision: Not required; narration is judged in context at N16/N20 and at release}
  provenance: [script.json per attempt; units cite claim ids]
  controls:
    read: [product, creative, production, spec-story]
    write: []
- id: n08_storyboard_shots
  num: 8
  name: Storyboard and shot planning
  phase: Design
  subgraph: planning
  kind: agent
  purpose: Turn the script into beats with one communication objective each, progressive disclosure, source-locked visuals, and a full specification for every seam, plus a shot list.
  inputs: ['artifact:script', 'artifact:design_system', 'control:creative', 'control:design', 'defects:rework', 'control:spec-story']
  context: ['Wei R07 P1/P2: one key message per frame; introduce entities progressively (6 steps), never all at once', 'video-shotcraft: specify each seam (outgoing and incoming anchor, direction, match frame, duration, audio bridge); one transition per seam', 'Narration-led films follow measured spoken beats, not a music grid']
  state_read: [production.script_ref, production.design_system_ref]
  state_write: [production.storyboard_ref, production.shotlist_ref, production.scenes]
  agent: storyboard
  skills: [storyboard, whiteboard-storyboard, video-shotcraft, video-prototype]
  tools: []
  instructions: 'Write storyboard.json (beats with unit_ids, a single objective, visual, source {type, ref}, duration, on-screen text, transition_out seam spec) and shotlist.json. Product UI beats reference real captures. Quality workflow: plan durations so each STORY.md beat gets its share of the runtime; the animatic (N27) then times the boards to a scratch read.'
  prompt: prompts/n08_storyboard_shots.md
  outputs:
  - key: storyboard
    kind: json
    schema: storyboard
    description: Beats and seams
    state_path: production.storyboard_ref
    state_fields: {beats: production.scenes}
  - {key: shotlist, kind: json, schema: shotlist, description: Shots per beat, state_path: production.shotlist_ref}
  completion:
  - {type: artifact, key: storyboard, schema: storyboard, description: Storyboard validates}
  - {type: tool, fn: 'storyboard:check', description: Every unit covered; one objective per beat; complete seams; within the cap}
  - {type: tool, fn: 'qualitygates:check_beats', description: Each STORY.md beat gets its planned share of the runtime}
  rubric: [storyboard]
  failure_conditions: [A beat with two objectives, A seam without anchors or an audio bridge, A script unit with no beat, A story beat far from its planned share of the runtime]
  retry: {max_attempts: 3, behavior: Re-dispatch with the failing beats and seams}
  escalation: {after: 3 consecutive failures, to: Wei, report: Beats that cannot meet the one-message rule within the cap}
  human_review: {required: false, decision: Not required; optional styleframe review with Wei before batching assets}
  provenance: [storyboard.json per attempt; beats cite unit ids and source refs]
  controls:
    read: [creative, design, spec-story]
    write: []
