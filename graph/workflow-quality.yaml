  rubric: [learning]
  failure_conditions: [A lesson without evidence, A lesson targeting a protected scope]
  retry: {max_attempts: 3, behavior: Re-dispatch listing the unclassified lessons}
  escalation: {after: 3 consecutive failures, to: Wei, report: Lessons that need Wei's classification}
