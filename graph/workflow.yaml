  # ------------------------------------------------------------------------------------------------ iteration
  - id: n21_feedback_interpretation
    num: 21
    name: Feedback interpretation
    phase: Learn
    subgraph: iteration
    kind: agent
    purpose: Turn every critique and every piece of human feedback into structured defects (severity, dimension, evidence, traced node, smallest fix, acceptance check), then gate the version pass / rework / blocked.
    inputs: ["reviews:current", "feedback:open", "defects:open", "control:evaluation"]
    context: ["Map vague feedback to testable defects, e.g. 'too crowded' → LEG-DENSITY on the named scene", "Trace each defect to the node that produced the defective artifact; the smallest fix wins"]
    state_read: [evaluation.reviews, evaluation.feedback, evaluation.defects]
    state_write: [evaluation.defects, evaluation.feedback, evaluation.gate_results, evaluation.comparisons]
    agent: production-orchestrator
    skills: [traffic-light-decisions, alignment-playbook, goal-harness]
    tools: []
    instructions: Write interpretation.json. `defects` lists new defects from feedback or critique. `feedback` gives every open feedback item a mapping (defect_ids, matches {dimension, traced_node}, or no_action_reason). `fixes` maps an open defect id to its smallest fix when the finding lacks one. The engine then compares against the previous version and computes the gate.
    prompt: prompts/n21_feedback_interpretation.md
    outputs:
      - {key: interpretation, kind: json, schema: interpretation, description: "Interpreted defects and the feedback mapping"}
    completion:
      - {type: artifact, key: interpretation, schema: interpretation, description: "Interpretation validates"}
      - {type: feedback_interpreted, description: "Every open feedback item is mapped or explicitly waived"}
      - {type: defects_valid, description: "Every defect traces to a known node"}
      - {type: tool, fn: "regen:check_traces", description: "Every open blocking defect names a known node, a smallest fix and an acceptance check"}
    rubric: [gate]
    failure_conditions: ["Feedback left uninterpreted", "A defect traced to an unknown node"]
    retry: {max_attempts: 3, behavior: "Re-dispatch listing the uninterpreted feedback"}
    escalation: {after: "Gate outcome blocked: a defect persisted 3 cycles, the rework budget is spent, or a defect needs a human decision", to: "Wei", report: "Open defects, what was tried, and the decision needed"}
    human_review: {required: false, decision: "Not required; blocked gates escalate"}
    provenance: ["Gate result per version", "Comparison per reworked defect (before/after, resolved)"]
    controls: {read: [evaluation], write: []}
    outcomes: [pass, rework, blocked]
    gate: review_gate

  - id: n22_targeted_regeneration
    num: 22
    name: Targeted regeneration
    phase: Learn
    subgraph: iteration
    kind: tool
    purpose: Route each blocking defect to the node that produced it, invalidate only those nodes and their dependents, and snapshot hashes for the before/after comparison.
    inputs: ["defects:open", "state:runtime.rework_cycles"]
    context: ["Re-run only the affected node and its invalidated dependents; approved upstream outputs are never regenerated"]
    state_read: [evaluation.defects, runtime.nodes]
    state_write: [runtime.rework_cycles]
    agent: production-orchestrator
    skills: [goal-harness, debugging-and-error-recovery]
    tools: ["vpg.tools.regen:plan"]
    instructions: Deterministic. The loop edges from this node re-activate each target with its defects as rework context.
    outputs:
      - {key: regeneration_plan, kind: json, description: "Targets, closure, preserved nodes, corrections, baseline hashes"}
    completion:
      - {type: artifact, key: regeneration_plan, description: "Plan exists"}
    rubric: [regeneration]
    failure_conditions: ["No routable target for a blocking defect"]
    retry: {max_attempts: 2, behavior: "Tool errors only"}
    escalation: {after: "A loop edge exceeds its traversal bound", to: "Wei", report: "The defect, its target and the cycles spent"}
    human_review: {required: false, decision: "Not required"}
    provenance: ["regeneration_plan ledger event with targets and preserved nodes"]
    run: {tool: "regen:plan"}
    gate: regeneration_plan

  # ------------------------------------------------------------------------------------------------- delivery
  - id: n23_final_verification
    num: 23
    name: Final verification
    phase: Learn
    subgraph: delivery
    kind: tool
    purpose: Recompute the release conditions from disk (gate, defects, reviewed master hash, deliverables, ledger), prepare the release summary, and ask Wei for the release decision.
    inputs: ["reviews:current", "defects:open", "artifact:master", "control:production"]
    context: ["Machine QA is not human release approval (R01 quality contract; every R07 report)"]
    state_read: [evaluation.gate_results, evaluation.defects, history.approvals]
    state_write: [history.decisions]
    agent: final-approval
    skills: [shipping-and-launch, traffic-light-decisions]
    tools: ["vpg.tools.verify:final"]
    instructions: Deterministic verification. Then the engine waits for Wei's decision (approved | changes_requested). Changes loop back to feedback interpretation.
    outputs:
      - {key: verification, kind: json, description: "Recomputed release checks"}
      - {key: release_summary, kind: markdown, description: "What Wei is asked to release"}
    completion:
      - {type: tool, fn: "verify:check_final", description: "Every release condition recomputes true"}
    rubric: [release]
    failure_conditions: ["No passing gate for the current version", "The master changed after review", "A deliverable missing"]
    retry: {max_attempts: 2, behavior: "Re-verify after the cause is fixed"}
    escalation: {after: "2 failed verifications", to: "Wei", report: "The release condition that fails"}
    human_review: {required: true, decision: "Release the version, or request changes with feedback", approver: Wei, outcomes: [approved, changes_requested]}
    provenance: ["Release decision recorded with actor; dry-run approvals labelled not human"]
    controls: {read: [production, evaluation], write: []}
    run: {tool: "verify:final"}
    outcomes: [approved, changes_requested]

