    run: {tool: "package:build"}
    gate: package

  - id: n25_learning_memory
    num: 25
    name: Post-production learning and memory updates
    phase: Learn
    subgraph: delivery
    kind: agent
    purpose: Capture what this production taught — failures, corrections, approvals, outcomes — separate project-specific lessons from reusable ones, update the project memory, and propose (never apply) rule-base changes.
    inputs: ["defects:all", "state:evaluation.comparisons", "knowledge:rules", "control:memory"]
    context: ["Rule lifecycle: candidate → observed again → validated → approved → adopted → monitored → revised/retired", "Protected scopes (objective, product truth, brand, approved design principles) are never changed by learning"]
    state_read: [evaluation.defects, evaluation.comparisons, knowledge]
    state_write: [knowledge.proposals]
    agent: learning-memory
    skills: [rubric-authoring, wiki-ingest, decision-capture, evidence-tagging]
    tools: ["vpg.tools.learning:propose"]
    instructions: The deterministic proposal comes first. Write lessons.json (each lesson classed reusable or project_specific, with evidence ids) and update controls/memory.md. Applying the proposal to knowledge/rules.json is a separate human command.
    prompt: prompts/n25_learning_memory.md
    outputs:
      - {key: learning_proposal, kind: json, schema: learning-proposal, description: "Observations and candidates (proposal only)"}
      - {key: lessons, kind: json, schema: lessons, description: "Classified lessons with evidence"}
    completion:
      - {type: artifact, key: learning_proposal, schema: learning-proposal, description: "Proposal validates"}
      - {type: tool, fn: "learning:check", description: "Every lesson is classed and evidenced; none targets a protected scope"}
    rubric: [learning]
    failure_conditions: ["A lesson without evidence", "A lesson targeting a protected scope"]
    retry: {max_attempts: 3, behavior: "Re-dispatch listing the unclassified lessons"}
    escalation: {after: "3 consecutive failures", to: "Wei", report: "Lessons that need Wei's classification"}
    human_review: {required: false, decision: "Not required for the run; applying the proposal to the rule base needs a named human (`vpg memory apply`)"}
    provenance: ["learning-proposal.json and lessons.json; rule-base changes only through the audited changelog"]
    controls: {read: [memory], write: [memory]}
    run: {tool: "learning:propose"}

