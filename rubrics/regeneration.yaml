# Targeted regeneration — reusable rubric; see knowledge/rules.json for default policy.
id: regeneration
name: Targeted regeneration
reviewer: production-orchestrator
scale: tool dimensions pass/fail; review dimensions 1–5 (threshold 4 = 'meets the project owner's bar'); human dimensions are decided by a named human
dimensions:
- id: REG-TARGETED
  name: Only affected nodes re-run
  brief_dimension: delivery_completeness
  level: MUST
  check:
    type: tool
    fn: regen:plan
  threshold: 1.0
  target: targets are traced nodes; upstream is preserved
  rule: R-PRO-008
  cases:
    never: []
    always: []
