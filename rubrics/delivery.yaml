# Delivery — reusable rubric; see knowledge/rules.json for default policy.
id: delivery
name: Delivery
reviewer: final-approval
scale: tool dimensions pass/fail; review dimensions 1–5 (threshold 4 = 'meets the project owner's bar'); human dimensions are decided by a named human
dimensions:
- id: DEL-MANIFEST
  name: Verified package
  brief_dimension: delivery_completeness
  level: MUST
  check:
    type: tool
    fn: package:check
  threshold: 1.0
  target: zip verifies against the per-file manifest
  rule: R-PRO-005
  cases:
    never: []
    always: []
- id: DEL-DELIVERABLES
  name: All deliverables
  brief_dimension: delivery_completeness
  level: MUST
  check:
    type: tool
    fn: package:check
  threshold: 1.0
  target: every production.md deliverable present
  rule: R-PRO-005
  cases:
    never: []
    always: []
