# Asset plan — reusable rubric; see knowledge/rules.json for default policy.
id: asset-plan
name: Asset plan
reviewer: asset-generation
scale: tool dimensions pass/fail; review dimensions 1–5 (threshold 4 = 'meets the project owner's bar'); human dimensions are decided by a named human
dimensions:
- id: AP-RULES
  name: Sources, rights, specificity
  brief_dimension: asset_specificity
  level: MUST
  check:
    type: tool
    fn: assets:check_plan
  threshold: 1.0
  target: no generated UI or logos; specific subjects; rights clear
  rule: R-AST-001
  cases:
    never: []
    always: []
