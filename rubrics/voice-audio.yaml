# Voice and audio — reusable rubric; see knowledge/rules.json for default policy.
id: voice-audio
name: Voice and audio
reviewer: voice-audio
scale: tool dimensions pass/fail; review dimensions 1–5 (threshold 4 = 'meets the project owner's bar'); human dimensions are decided by a named human
dimensions:
- id: VOI-COMPLETE
  name: Complete, unclipped narration
  brief_dimension: voice_quality
  level: MUST
  check:
    type: tool
    fn: audio:check_voice
  threshold: 1.0
  target: every unit in order; no clipping; no masked speech
  rule: R-VOI-002
  cases:
    never: []
    always: []
- id: VOI-SEAMS
  name: Clean narration seams
  brief_dimension: voice_quality
  level: MUST
  check:
    type: tool
    fn: audio:check_seams
  threshold: 1.0
  target: no loud tails, hard cuts, overlaps or hard onsets at unit seams
  rule: R-VOI-004
  cases:
    never: []
    always: []
