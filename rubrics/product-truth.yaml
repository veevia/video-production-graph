# Product truth — generated from the 2026-09 case study (knowledge/case-studies/); see knowledge/rules.json for each dimension's rule.
id: product-truth
name: Product truth
reviewer: product-understanding
scale: tool dimensions pass/fail; review dimensions 1–5 (threshold 4 = 'meets Wei's bar'); human dimensions are decided by a named human
dimensions:
- id: PT-CONTRACT
  name: Machine contract
  brief_dimension: product_accuracy
  level: MUST
  check:
    type: tool
    fn: briefs:doc_complete
  threshold: 1.0
  target: terminology, prohibited and verified_claims each with sources
  rule: R-ACC-001
  cases:
    never: []
    always: []
- id: PT-NOT-INVENTED
  name: Nothing invented
  brief_dimension: product_accuracy
  level: MUST
  check:
    type: human
  threshold: null
  target: 'Wei approves product truth at N04: every claim traced to an engineer source'
  rule: R-ACC-002
  cases:
    never:
    - A capability with no source
    always:
    - List it under 'content that must not be invented'
    - Record Wei's product-truth decision
